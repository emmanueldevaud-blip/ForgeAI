version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: forgeai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: forgeai
      MYSQL_USER: forgeai
      MYSQL_PASSWORD: forgeai_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: forgeai-app
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=mysql://forgeai:forgeai_password@mysql:3306/forgeai
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:8000"]
      - AUTH_LOCAL_ENABLED=true
      - AD_ENABLED=${AD_ENABLED:-true}
      - SPORT_AI_PROVIDER=${SPORT_AI_PROVIDER:-gemini}
      - SPORT_AI_BASE_URL=${SPORT_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - SPORT_AI_API_KEY=${SPORT_AI_API_KEY:-}
      - SPORT_AI_MODEL=${SPORT_AI_MODEL:-gemini-3.7-flash}
      - SPORT_AI_TIMEOUT_SECONDS=${SPORT_AI_TIMEOUT_SECONDS:-20}
      - AI_GATEWAY_ENABLED=${AI_GATEWAY_ENABLED:-true}
      - AI_DEFAULT_PROVIDER=${AI_DEFAULT_PROVIDER:-auto}
      - AI_DEFAULT_MODEL=${AI_DEFAULT_MODEL:-auto}
      - AI_PROVIDER_ORDER=${AI_PROVIDER_ORDER:-groq,gemini,openrouter}
      - AI_ROUTER_PREFER_FREE=${AI_ROUTER_PREFER_FREE:-true}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-brave}
      - WEB_SEARCH_API_KEY=${WEB_SEARCH_API_KEY:-}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-8}
      - WEB_SEARCH_TIMEOUT_SECONDS=${WEB_SEARCH_TIMEOUT_SECONDS:-15.0}
      - WEB_SEARCH_FALLBACK_ENABLED=${WEB_SEARCH_FALLBACK_ENABLED:-true}
      - WEB_SEARCH_CACHE_ENABLED=${WEB_SEARCH_CACHE_ENABLED:-true}
      - WEB_SEARCH_CACHE_TTL_SECONDS=${WEB_SEARCH_CACHE_TTL_SECONDS:-3600}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-2}
      - AI_RETRY_BACKOFF_SECONDS=${AI_RETRY_BACKOFF_SECONDS:-1.0}
      - DEVELOPMENT_AGENT_ENABLED=${DEVELOPMENT_AGENT_ENABLED:-true}
      - OPENCODE_ENABLED=${OPENCODE_ENABLED:-true}
      - OPENCODE_WORK_DIR=/app/repo
      - OPENCODE_BIN=/home/edevaud/.opencode/bin/opencode
      - HOME=/home/edevaud
      - GROQ_ENABLED=${GROQ_ENABLED:-true}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - GEMINI_ENABLED=${GEMINI_ENABLED:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - OPENROUTER_ENABLED=${OPENROUTER_ENABLED:-true}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - SPORT_ANALYSIS_ENABLED=${SPORT_ANALYSIS_ENABLED:-true}
      - SPORT_MORNING_ANALYSIS_ENABLED=${SPORT_MORNING_ANALYSIS_ENABLED:-true}
      - SPORT_MORNING_ANALYSIS_TIME=${SPORT_MORNING_ANALYSIS_TIME:-07:00}
      - SPORT_MORNING_ANALYSIS_DEADLINE=${SPORT_MORNING_ANALYSIS_DEADLINE:-10:00}
      - SPORT_EVENING_ANALYSIS_ENABLED=${SPORT_EVENING_ANALYSIS_ENABLED:-true}
      - SPORT_EVENING_ANALYSIS_TIME=${SPORT_EVENING_ANALYSIS_TIME:-20:30}
      - SPORT_ACTIVITY_ANALYSIS_ENABLED=${SPORT_ACTIVITY_ANALYSIS_ENABLED:-true}
      - SPORT_ACTIVITY_ANALYSIS_DELAY_MINUTES=${SPORT_ACTIVITY_ANALYSIS_DELAY_MINUTES:-15}
      - SPORT_ANALYSIS_TIMEZONE=${SPORT_ANALYSIS_TIMEZONE:-Europe/Paris}
      - NOTIFICATION_VAPID_PUBLIC_KEY=${NOTIFICATION_VAPID_PUBLIC_KEY:-}
      - NOTIFICATION_VAPID_PRIVATE_KEY=${NOTIFICATION_VAPID_PRIVATE_KEY:-}
      - NOTIFICATION_VAPID_SUBJECT=${NOTIFICATION_VAPID_SUBJECT:-}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./src/public:/app/src/public
      # Repository Git complet (statut / commit / déploiement de l'Agent Développement)
      - .:/app/repo
      # OpenCode (édition de code) + sa configuration
      - ${HOME}/.opencode:/home/edevaud/.opencode:ro
      - ${HOME}/.config/opencode:/home/edevaud/.config/opencode:ro
      - ${HOME}/.local:/home/edevaud/.local
      - ${HOME}/.cache:/home/edevaud/.cache
      # SSH + script de déploiement (déploiement production)
      - ${HOME}/.ssh:/home/edevaud/.ssh:ro
      - ${HOME}/deploy-forgeai.sh:/home/edevaud/deploy-forgeai.sh:ro

volumes:
  mysql_data:
