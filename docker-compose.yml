version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: forgeai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: forgeai
      MYSQL_USER: forgeai
      MYSQL_PASSWORD: forgeai_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: forgeai-app
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=mysql://forgeai:forgeai_password@mysql:3306/forgeai
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:8000"]
      - AUTH_LOCAL_ENABLED=true
      - AD_ENABLED=${AD_ENABLED:-true}
      - SPORT_AI_PROVIDER=${SPORT_AI_PROVIDER:-gemini}
      - SPORT_AI_BASE_URL=${SPORT_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - SPORT_AI_API_KEY=${SPORT_AI_API_KEY:-}
      - SPORT_AI_MODEL=${SPORT_AI_MODEL:-gemini-3.7-flash}
      - SPORT_AI_TIMEOUT_SECONDS=${SPORT_AI_TIMEOUT_SECONDS:-20}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./src/public:/app/src/public

volumes:
  mysql_data:
