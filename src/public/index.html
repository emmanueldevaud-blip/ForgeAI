<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeAI Demo - Todo App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Todo App Demo</h1>
      <p class="subtitle">Application de démonstration ForgeAI</p>
    </header>
    
    <main>
      <form id="todo-form" class="todo-form">
        <input 
          type="text" 
          id="todo-input" 
          placeholder="Ajouter une tâche..." 
          required
          autocomplete="off"
        >
        <button type="submit">Ajouter</button>
      </form>
      
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Toutes</button>
        <button class="filter-btn" data-filter="active">Actives</button>
        <button class="filter-btn" data-filter="completed">Terminées</button>
      </div>
      
      <ul id="todo-list" class="todo-list"></ul>
      
      <div id="stats" class="stats">
        <span id="total-count">0</span> tâches total, 
        <span id="active-count">0</span> actives, 
        <span id="completed-count">0</span> terminées
      </div>
    </main>
    
    <footer>
      <p>Propulsé par <a href="https://expressjs.com/" target="_blank">Express</a> + Vanilla JS</p>
    </footer>
  </div>
  
  <script src="/js/app.js"></script>
</body>
</html>
